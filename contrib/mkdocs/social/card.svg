<!--
  The link-preview card of hql-lang.org: the image LinkedIn, X, Slack and
  others show for a shared link (`og:image`; see
  `contrib/mkdocs/overrides/main.html`). It is the front page's hero in dark:
  the dot grid, the amber glow and the tagline's gradient from
  `doc/public/assets/hql.css`. 1200 by 630 is the size those sites crop to.

  The published file is the PNG, `doc/public/assets/social-card.png`. After an
  edit, render it again with `render.py` beside this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1020" cy="60" r="760"
                    gradientTransform="translate(1020 60) scale(1 0.7) translate(-1020 -60)">
      <stop offset="0" stop-color="#ffc233" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffc233" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tagline" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1000" y2="120">
      <stop offset="0.35" stop-color="#f2f1f4"/>
      <stop offset="1" stop-color="#ffc233"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#141317"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Corner ticks, the diagram language of the front page. -->
  <g fill="none" stroke="#ffc233" stroke-width="3" stroke-linecap="square">
    <path d="M40 76V40H76"/>
    <path d="M1124 40H1160V76"/>
    <path d="M40 554V590H76"/>
    <path d="M1124 590H1160V554"/>
  </g>

  <!-- The logo, `doc/public/assets/logo.svg`, at 5.5 times its 24-unit box. -->
  <path transform="translate(80 128) scale(5.5)" fill="#ffb300"
        d="M2.6 3h18.8a.9.9 0 0 1 .7 1.47L14.6 13.9v6.2a.9.9 0 0 1-.5.8l-3 1.5a.9.9 0 0 1-1.3-.8v-7.7L1.9 4.47A.9.9 0 0 1 2.6 3z"/>
  <text x="236" y="252" font-family="Inter" font-weight="800" font-size="168"
        letter-spacing="-8" fill="#f2f1f4">HQL</text>

  <g font-family="Inter" font-weight="600" font-size="56" letter-spacing="-0.8" fill="url(#tagline)">
    <text x="80" y="378">A strongly typed expression</text>
    <text x="80" y="446">and query language.</text>
  </g>

  <line x1="80" y1="500" x2="1120" y2="500" stroke="#ffc233" stroke-opacity="0.45" stroke-width="2"/>
  <text x="80" y="550" font-family="JetBrains Mono" font-weight="600" font-size="30"
        fill="#ffc233">hql-lang.org</text>
  <text x="1120" y="550" text-anchor="end" font-family="JetBrains Mono" font-weight="500"
        font-size="28" fill="#f2f1f4" fill-opacity="0.6">$ cargo install hql</text>
</svg>
