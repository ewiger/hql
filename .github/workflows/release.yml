name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build a release from
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the Apple silicon runner: the `macos-13` image
          # that ran x86_64 natively is retired, and a job asking for it queues
          # forever rather than failing. `cross` marks the target whose tests
          # this runner cannot execute.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # A cross-compiled target's tests cannot run here: the runner executes a
      # different architecture. The same commit is tested natively on the other
      # two targets, and CI tests it on Linux and macOS besides.
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          name="hql-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/hql "dist/$name/"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          shasum -a 256 "dist/$name.tar.gz" | sed "s| dist/| |" > "dist/$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Take the release notes from the changelog
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          awk -v v="${version#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version#v}" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          gh release create "$version" \
            --title "$version" \
            --notes-file notes.md \
            dist/*

  # Last, because it is the one step that cannot be undone: a GitHub release can
  # be deleted and cut again, a published crate version stays published.
  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # Trusted publishing: GitHub mints a short-lived OIDC token that crates.io
      # exchanges for a publish token, so no registry secret is stored anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag against the manifest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "tag $tag does not name version $manifest from Cargo.toml" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `cargo publish` packages and builds the package before uploading, so a
      # crate that does not build from its own `.crate` file never reaches the
      # registry.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
