name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build a release from
        required: true
      dry_run:
        description: Check and build only; publish nothing
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release is cut from a commit CI has tested on Linux, macOS and Windows,
  # so the build jobs below do not test it again. This job waits for CI's
  # verdict on the tagged commit: a tag pushed right after the merge finds
  # CI still running. It runs beside the builds, and nothing is published
  # until it passes.
  tested:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # 45 minutes for a run to finish, 5 for one to appear.
          for minute in $(seq 1 45); do
            state=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha" --jq '
              if any(.workflow_runs[]; .conclusion == "success") then "passed"
              elif any(.workflow_runs[]; .status != "completed") then "running"
              elif (.workflow_runs | length) > 0 then "failed"
              else "none" end')
            case "$state" in
              passed) echo "CI passed on $sha"; exit 0 ;;
              failed) echo "CI failed on $sha; it is not released" >&2; exit 1 ;;
              none)
                if [ "$minute" -ge 5 ]; then
                  echo "CI never ran on $sha; release a commit CI has tested" >&2
                  exit 1
                fi ;;
            esac
            sleep 60
          done
          echo "CI on $sha did not finish within 45 minutes" >&2
          exit 1

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the Apple silicon runner: the `macos-13` image
          # that ran x86_64 natively is retired, and a job asking for it queues
          # forever rather than failing.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # One shell on every runner: the steps below are written for it.
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks text out with CRLF by default. The fixtures the
      # tests compare byte for byte, and the files packaged below, stay LF.
      - name: Keep LF line endings
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      # The reference pages were updated from the doc strings when the release
      # was cut; a tag whose pages differ from its library is not released.
      - name: Check the reference pages
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: target/${{ matrix.target }}/release/hql reference --check doc/public/reference
      - name: Package
        id: package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          name="hql-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # The Windows binary is `hql.exe`. Its archive is a `.tar.gz` like
          # the others, so one reader unpacks every target.
          binary=hql
          if [ "${{ runner.os }}" = Windows ]; then binary=hql.exe; fi
          cp "target/${{ matrix.target }}/release/$binary" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          # `sha256sum` marks a file read in binary mode with `*` on Windows;
          # the sidecar has one form on every target, `<digest>  <name>`.
          digest=$(sha256sum "dist/$name.tar.gz" 2>/dev/null || shasum -a 256 "dist/$name.tar.gz")
          echo "${digest%% *}  $name.tar.gz" > "dist/$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [tested, build]
    # A dry run stops here; `docs` and `crates-io` need this job, so they
    # are skipped with it.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Take the release notes from the changelog
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          awk -v v="${version#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version#v}" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          gh release create "$version" \
            --title "$version" \
            --notes-file notes.md \
            dist/*

  # The release's documentation (the Book, Examples and Reference), at
  # `/vX.Y.Z/`, and `/latest/` moved to it. mike commits each version's build
  # to its own folder on `gh-pages`, which Pages serves; a version is published
  # once and never rebuilt. The root of `gh-pages` is the website, published
  # from `main` by `pages.yml`, so no version is made the default: mike's
  # default would replace the website's home page with a redirect.
  docs:
    name: Publish the documentation
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with `pages.yml`'s `publish`: one push to `gh-pages` at a time.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      # The site's ```d2 fences are drawn at build time by the `d2` binary;
      # without it a diagram degrades to its source.
      - name: Install d2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
      - name: Publish the version and move latest to it
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "tag $tag does not name version $manifest from Cargo.toml" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          if uv run mike list 2>/dev/null | grep -Eq "^$tag( |$)"; then
            echo "$tag is already published; a version is published once" >&2
            exit 1
          fi
          uv run mike deploy --push --update-aliases "$tag" latest
      # The custom domain lives at the branch root, beside the versions; mike
      # leaves root files it did not write.
      - name: Keep the custom domain
        run: |
          git worktree add ../pages gh-pages
          if [ ! -f ../pages/CNAME ]; then
            echo hql-lang.org > ../pages/CNAME
            git -C ../pages add CNAME
            git -C ../pages commit -m "Pages: the custom domain"
            git -C ../pages push origin gh-pages
          fi

  # Last, because it is the one step that cannot be undone: a GitHub release can
  # be deleted and cut again, a published crate version stays published. It
  # runs once the documentation is published.
  crates-io:
    name: Publish to crates.io
    needs: [release, docs]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # Trusted publishing: GitHub mints a short-lived OIDC token that crates.io
      # exchanges for a publish token, so no registry secret is stored anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag against the manifest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "tag $tag does not name version $manifest from Cargo.toml" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `cargo publish` packages and builds the package before uploading, so a
      # crate that does not build from its own `.crate` file never reaches the
      # registry.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
