name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build a release from
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the Apple silicon runner: the `macos-13` image
          # that ran x86_64 natively is retired, and a job asking for it queues
          # forever rather than failing. `cross` marks the target whose tests
          # this runner cannot execute.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # A cross-compiled target's tests cannot run here: the runner executes a
      # different architecture. The same commit is tested natively on the other
      # two targets, and CI tests it on Linux and macOS besides.
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      # The reference pages were updated from the doc strings when the release
      # was cut; a tag whose pages differ from its library is not released.
      - name: Check the reference pages
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: target/${{ matrix.target }}/release/hql reference --check doc/public/reference
      - name: Package
        id: package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          name="hql-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/hql "dist/$name/"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          shasum -a 256 "dist/$name.tar.gz" | sed "s| dist/| |" > "dist/$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Take the release notes from the changelog
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          awk -v v="${version#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version#v}" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          gh release create "$version" \
            --title "$version" \
            --notes-file notes.md \
            dist/*

  # The release's documentation, at `/vX.Y.Z/`, and `/latest/` moved to it.
  # mike commits each version's build to its own folder on `gh-pages`, which
  # Pages serves; a version is published once and never rebuilt.
  docs:
    name: Publish the documentation
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Publish the version and move latest to it
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "tag $tag does not name version $manifest from Cargo.toml" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          if uv run mike list 2>/dev/null | grep -Eq "^$tag( |$)"; then
            echo "$tag is already published; a version is published once" >&2
            exit 1
          fi
          uv run mike deploy --push --update-aliases "$tag" latest
          uv run mike set-default --push latest
      # The custom domain lives at the branch root, beside the versions; mike
      # leaves root files it did not write.
      - name: Keep the custom domain
        run: |
          git worktree add ../pages gh-pages
          if [ ! -f ../pages/CNAME ]; then
            echo hql-lang.org > ../pages/CNAME
            git -C ../pages add CNAME
            git -C ../pages commit -m "Pages: the custom domain"
            git -C ../pages push origin gh-pages
          fi

  # Last, because it is the one step that cannot be undone: a GitHub release can
  # be deleted and cut again, a published crate version stays published. It
  # runs once the documentation is published.
  crates-io:
    name: Publish to crates.io
    needs: [release, docs]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # Trusted publishing: GitHub mints a short-lived OIDC token that crates.io
      # exchanges for a publish token, so no registry secret is stored anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag against the manifest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "tag $tag does not name version $manifest from Cargo.toml" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `cargo publish` packages and builds the package before uploading, so a
      # crate that does not build from its own `.crate` file never reaches the
      # registry.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
