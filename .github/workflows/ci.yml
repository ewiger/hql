name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # One shell on every runner: the steps below are written for it.
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks text out with CRLF by default. The fixtures and
      # the reference pages are compared byte for byte, so they stay LF.
      - name: Keep LF line endings
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked --no-fail-fast
      # The release workflow refuses a tag whose reference pages differ from
      # the doc strings; a pull request learns it here first.
      - name: Check the reference pages
        run: target/debug/hql reference --check doc/public/reference

  minimum-rust-version:
    name: Build on the rust-version floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the floor from Cargo.toml
        id: floor
        run: |
          floor=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$floor" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.floor.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.floor.outputs.version }} build --locked
