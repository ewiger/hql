name: Pages

# The site's build, deliberately not a job inside `ci.yml`: a pull request
# and `main` build it so a broken page is caught before a release publishes
# it.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "doc/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only: this workflow builds the site and publishes nothing. A release
# publishes its version with mike, in the `docs` job of `release.yml`.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # From the lockfile, so the published site is built from the versions
      # that were built locally rather than whatever resolved this morning.
      - name: Install
        run: uv sync --locked

      # Nothing is published that does not build clean.
      - name: Build
        run: uv run mkdocs build --strict
