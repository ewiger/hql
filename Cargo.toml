[package]
name = "hql"
version = "0.1.0"
description = "HQL — Hyper Query Language: an experimental typed functional language"
license = "MIT"
publish = false
edition = "2024"
rust-version = "1.85"

[lib]
name = "hql"
path = "src/lib.rs"

[[bin]]
name = "hql"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
toml = "1.1.6"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
