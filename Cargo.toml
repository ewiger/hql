[package]
name = "hql"
version = "0.7.2"
description = "HQL — Hyper Query Language: a typed functional language for structured knowledge"
license = "MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ewiger/hql"
homepage = "https://github.com/ewiger/hql"
readme = "README.md"
keywords = ["query-language", "knowledge-graph", "markdown", "interpreter"]
categories = ["command-line-utilities", "text-processing"]
# A package is the crate, not the repository: the knowledge base, the corpora,
# the Python producer, the documentation site, CI and the agent instructions
# all stay behind.
exclude = [
    "/.claude",
    "/.github",
    "/.grem",
    "/contrib",
    "/crates",
    "/doc",
    "/examples",
    "/tests",
    "AGENTS.md",
    "CLAUDE.md",
    "mkdocs.base.yml",
    "mkdocs.site.yml",
    "mkdocs.yml",
    "pyproject.toml",
    "uv.lock",
]

# `hql-wasm` is the browser build's bindings (HQL-0061); it is not published.
[workspace]
members = [".", "crates/hql-wasm"]
default-members = ["."]

[lib]
name = "hql"
path = "src/lib.rs"

[[bin]]
name = "hql"
path = "src/main.rs"
required-features = ["native"]

# `native` is everything that needs a socket, a process, a dynamic library or
# a terminal: the server endpoints, HTTP, package loading and the command
# line. Without it the crate is the language alone — lexer, parser, checker,
# evaluator and the standard modules — and builds for
# `wasm32-unknown-unknown` (HQL-0061).
[features]
default = ["native"]
native = [
    "dep:async-nats",
    "dep:clap",
    "dep:futures-util",
    "dep:libloading",
    "dep:postgres",
    "dep:rskafka",
    "dep:rustyline",
    "dep:tokio",
    "dep:tungstenite",
    "dep:ureq",
]

[dependencies]
aes-gcm = "0.11"
age = { version = "0.12", default-features = false, features = ["armor"] }
argon2 = "0.6"
async-nats = { version = "0.52.0", default-features = false, features = ["ring", "jetstream"], optional = true }
base64 = "0.23.1"
bech32 = "0.11"
bigdecimal = "0.4.11"
blake3 = { version = "1.8.7", default-features = false, features = ["pure", "std"] }
chacha20poly1305 = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"], optional = true }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core", "zeroize"] }
futures-util = { version = "0.3.34", default-features = false, optional = true }
getrandom = { version = "0.4", features = ["sys_rng"] }
hmac = "0.13"
hypermarkdown = "0.2"
jiff = { version = "0.2.43", features = ["tzdb-bundle-always"] }
jiff-tzdb = "0.1.9"
libloading = { version = "0.8", optional = true }
md-5 = "0.11"
num-integer = "0.1.47"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
pem-rfc7468 = "1"
pkcs5 = { version = "0.8", features = ["sha1-insecure"] }
pkcs8 = { version = "0.11", features = ["pem", "encryption", "std"] }
postgres = { version = "0.19", optional = true }
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
rand_core_10 = { version = "0.10", package = "rand_core" }
regex = "1.13.1"
rsa = { version = "0.10", features = ["pkcs1v15"] }
rskafka = { version = "0.6", default-features = false, features = ["compression-gzip", "compression-snappy"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"], optional = true }
semver = "1"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_yaml_ng = "0.10.0"
sha1 = "0.11"
sha2 = { version = "0.11", features = ["oid"] }
signature = "3"
spki = "0.8"
ssh-encoding = "0.2"
ssh-key = { version = "0.6", default-features = false, features = ["std", "encryption", "ecdsa"] }
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "net", "time"], optional = true }
toml = "1.1.6"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
uuid = { version = "1.29.2", default-features = false, features = ["v5"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"

# In a browser, randomness comes from the page's `crypto.getRandomValues`.
# Both `getrandom` lines in the tree are told so; 0.4 also reads the
# `getrandom_backend` cfg set in `.cargo/config.toml`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["sys_rng", "wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# The clock is the page's `Date.now()`.
jiff = { version = "0.2.43", features = ["tzdb-bundle-always", "js"] }
