[package]
name = "hql"
version = "0.1.0"
description = "HQL — Hyper Query Language: an experimental typed functional language"
license = "MIT"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/ewiger/hql"
homepage = "https://github.com/ewiger/hql"
readme = "README.md"
keywords = ["query-language", "knowledge-graph", "markdown", "interpreter"]
categories = ["command-line-utilities", "text-processing"]
# A package is the crate, not the repository: the knowledge base, the corpora,
# the Python producer, CI and the agent instructions all stay behind.
exclude = [
    "/.claude",
    "/.github",
    "/.grem",
    "/contrib",
    "/doc",
    "/examples",
    "/tests",
    "AGENTS.md",
    "CLAUDE.md",
]

[lib]
name = "hql"
path = "src/lib.rs"

[[bin]]
name = "hql"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2"
toml = "1.1.6"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
