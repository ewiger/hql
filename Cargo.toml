[package]
name = "hql"
version = "0.1.0"
description = "HQL — Hyper Query Language: an experimental typed functional language"
license = "MIT"
publish = false
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/ewiger/hql"
homepage = "https://github.com/ewiger/hql"
readme = "README.md"
keywords = ["query-language", "knowledge-graph", "markdown", "interpreter"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/.github", "/.grem", "/contrib", "/doc", "/examples"]

[lib]
name = "hql"
path = "src/lib.rs"

[[bin]]
name = "hql"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2"
toml = "1.1.6"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
