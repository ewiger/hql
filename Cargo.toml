[package]
name = "hql"
version = "0.5.2"
description = "HQL — Hyper Query Language: a typed functional language for structured knowledge"
license = "MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ewiger/hql"
homepage = "https://github.com/ewiger/hql"
readme = "README.md"
keywords = ["query-language", "knowledge-graph", "markdown", "interpreter"]
categories = ["command-line-utilities", "text-processing"]
# A package is the crate, not the repository: the knowledge base, the corpora,
# the Python producer, the documentation site, CI and the agent instructions
# all stay behind.
exclude = [
    "/.claude",
    "/.github",
    "/.grem",
    "/contrib",
    "/doc",
    "/examples",
    "/tests",
    "AGENTS.md",
    "CLAUDE.md",
    "mkdocs.yml",
    "pyproject.toml",
    "uv.lock",
]

[lib]
name = "hql"
path = "src/lib.rs"

[[bin]]
name = "hql"
path = "src/main.rs"

[dependencies]
async-nats = { version = "0.52.0", default-features = false, features = ["ring", "jetstream"] }
bigdecimal = "0.4.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
jiff = { version = "0.2.43", features = ["tzdb-bundle-always"] }
num-integer = "0.1.47"
postgres = "0.19"
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
regex = "1.13.1"
rskafka = { version = "0.6", default-features = false, features = ["compression-gzip", "compression-snappy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }
toml = "1.1.6"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1.29.2", default-features = false, features = ["v5"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
