# The documentation: the Book, Examples and Reference, as of one version of
# HQL. mike publishes each release under `/vX.Y.Z/`, `latest` the newest, and
# `main` under `/draft/`. Home, Install and the Blog are the website,
# `mkdocs.site.yml`, always current at the root; this build reaches them by
# root-absolute links. What both builds share is in `mkdocs.base.yml`.
INHERIT: mkdocs.base.yml

plugins:
  - search
  # Pages are hyper-markdown. `doc/public/` is a vault of its own (it has an
  # `.hmd/`), and the plugin resolves `[[…]]` against that root and registers
  # each `.hmd` page under its `.md` name, so the nav below names `x.md` and
  # the URL is unchanged. The nav stays authored, not derived.
  - hypermarkdown:
      root: doc/public
      build_nav: false
  # Each release is published under its version, `/vX.Y.Z/`, and `latest`
  # is the newest; see the documentation-site section of `doc/stack.hmd`.
  - mike:
      alias_type: redirect
      canonical_version: latest

# The tabs are the website's, so a reader moving between the two parts sees
# one site. Home, Install and Blog are the website's pages, at the root; the
# rest are this version's. A top-level tab with children opens as a menu of
# them; see `contrib/mkdocs/overrides/partials/tabs-item.html`.
