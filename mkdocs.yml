site_name: HQL
site_description: Hyper Query Language — a strongly typed language for querying, transforming, connecting and computing over data, knowledge and AI workflows.

# Served from GitHub Pages under a custom domain. The build does not need this —
# MkDocs emits relative links — but canonical URLs and `sitemap.xml` are wrong
# without it. The domain itself is a DNS record plus the repository's Pages
# setting; see the documentation-site section of `doc/stack.hmd`.
site_url: https://hql-lang.org/

repo_url: https://github.com/ewiger/hql
repo_name: ewiger/hql
edit_uri: edit/main/doc/public/

# Everything in this repository is MIT, code and prose alike, so one string
# states the whole claim and no footer template has to carry two.
copyright: © 2026 Yauhen Yakimovich · <a href="https://github.com/ewiger/hql/blob/main/LICENSE">MIT</a>

# The site is for people using HQL, and only `doc/public/` is published. The
# design of the language — the wiki, the models, the proposals and the working
# memory — stays in the repository.
docs_dir: doc/public

# A card and its folder note share one URL, so directory URLs are required.
use_directory_urls: true

theme:
  name: material
  # Template overrides; outside `docs_dir`, so nothing in it is published.
  custom_dir: contrib/mkdocs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  # The sibling site's chrome — near-black with an amber accent — so the two
  # read as one family. HQL's own mark sets it apart rather than a new palette.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # Pages are hyper-markdown. `doc/public/` is a vault of its own (it has an
  # `.hmd/`), and the plugin resolves `[[…]]` against that root and registers
  # each `.hmd` page under its `.md` name, so the nav below names `x.md` and
  # the URL is unchanged. The nav stays authored, not derived.
  - hypermarkdown:
      root: doc/public
      build_nav: false
  # Each release is published under its version, `/vX.Y.Z/`, and `latest`
  # is the newest; see the documentation-site section of `doc/stack.hmd`.
  - mike:
      alias_type: redirect
      canonical_version: latest

# Runs after the plugins. A folder note `a/b/index.hmd` is the page `a/b.md`,
# and this points its relative Markdown links at what they name from the
# folder note's own directory. Removed once the plugin does this itself
# (hypermarkdown issue 0010).
hooks:
  - contrib/mkdocs/folder_notes.py

# `Learn` is the prose read cold, in reading order. `Reference` is what is
# consulted afterwards. A top-level tab with children opens as a menu of
# them; see `contrib/mkdocs/overrides/partials/tabs-item.html`.
nav:
  - Home: index.md
  - Learn:
      - Install: install.md
      - HQL Book:
          - book.md
          - "Part I: The language":
              - 1. Hello world: book/01-hello-world.md
              - 2. Data types:
                  - book/02-data-types.md
                  - Int: book/02-data-types/int.md
                  - Float: book/02-data-types/float.md
                  - Decimal: book/02-data-types/decimal.md
                  - String: book/02-data-types/string.md
                  - Bool: book/02-data-types/bool.md
                  - Bytes: book/02-data-types/bytes.md
                  - Date and time: book/02-data-types/time.md
                  - Data: book/02-data-types/data.md
                  - Option: book/02-data-types/option.md
                  - Sets, Data and maps: book/02-data-types/sets-data-and-maps.md
              - 3. Collections: book/03-collections.md
              - 4. Functions:
                  - book/04-functions.md
                  - Declaring a function: book/04-functions/declaring.md
                  - Function bodies: book/04-functions/bodies.md
                  - Generic functions: book/04-functions/generics.md
                  - Aliases and holes: book/04-functions/aliases-and-holes.md
              - 5. Modules:
                  - book/05-modules.md
                  - Receiver modules: book/05-modules/receiver-modules.md
                  - Visibility: book/05-modules/visibility.md
                  - How names resolve: book/05-modules/names.md
                  - Modules and packages: book/05-modules/packages.md
              - 6. SQL-like Queries: book/06-sql-like-queries.md
              - 7. Streams that do not end: book/07-streams.md
              - 8. Writing results out: book/08-output.md
              - 9. I/O:
                  - book/09-io.md
                  - Files and Standard Endpoints: book/09-io/endpoints.md
                  - Reading with source: book/09-io/source.md
                  - Writing with target and sink: book/09-io/target.md
                  - Finite or live: book/09-io/finite-or-live.md
                  - Formats and documents: book/09-io/formats.md
                  - Endpoints by id: book/09-io/configured.md
                  - Subjects and lakehouse tables: book/09-io/subjects-and-lakehouses.md
                  - Channels: book/09-io/channels.md
                  - Logging: book/09-io/logging.md
                  - The network: book/09-io/network.md
                  - Files and folders: book/09-io/files-and-folders.md
                  - Environment and arguments: book/09-io/environment.md
                  - Effects and what a host allows: book/09-io/hosts.md
                  - hql on the command line: book/09-io/command-line.md
              - 10. The type system:
                  - book/10-the-type-system.md
                  - Records: book/10-the-type-system/records.md
                  - Unions and match: book/10-the-type-system/unions-and-match.md
                  - Results: book/10-the-type-system/results.md
                  - Subtypes and narrowing: book/10-the-type-system/subtypes.md
                  - Generics: book/10-the-type-system/generics.md
                  - Receiver calls: book/10-the-type-system/receiver-calls.md
                  - Operators: book/10-the-type-system/operators.md
                  - Traits: book/10-the-type-system/traits.md
              - 11. Advanced data typing:
                  - book/11-advanced-data-typing.md
                  - Open and closed types: book/11-advanced-data-typing/open-and-closed.md
                  - Type contracts: book/11-advanced-data-typing/type-contracts.md
                  - Data contracts: book/11-advanced-data-typing/data-contracts.md
                  - Validators: book/11-advanced-data-typing/validators.md
                  - Validation as a value: book/11-advanced-data-typing/validation-as-a-value.md
                  - Contracts and schemas: book/11-advanced-data-typing/contracts-and-schemas.md
              - 12. Errors:
                  - book/12-errors.md
                  - Failures as data: book/12-errors/handling.md
                  - Diagnostics: book/12-errors/diagnostics.md
              - 13. Working with hql: book/13-working-with-hql.md
          - "Part II: Data flows":
              - 14. ETL pipelines:
                  - Overview: book/14-etl-pipelines.md
                  - Logical steps and physical plans: book/14-planning-and-backends.md
              - 15. Endpoints: book/15-endpoints.md
              - 16. Tables and topics: book/16-tables-and-topics.md
              - 17. Subjects and the lakehouse: book/17-subjects-and-the-lakehouse.md
              - 18. APIs, webhooks and stores: book/18-apis-webhooks-and-stores.md
              - 19. OLTP:
                  - book/19-oltp.md
                  - The shop's day in one file: book/19-oltp/the-shops-day.md
                  - When a mistake is found: book/19-oltp/mistakes.md
                  - A replay is the same file: book/19-oltp/replay.md
                  - Streams against tables: book/19-oltp/streams-against-tables.md
                  - A transfer is one transaction: book/19-oltp/transfers.md
              - 20. OLAP:
                  - book/20-olap.md
                  - Bronze, silver and gold: book/20-olap/bronze-silver-and-gold.md
                  - Grain and keys: book/20-olap/grain-and-keys.md
                  - Deduplication: book/20-olap/deduplication.md
                  - Windows: book/20-olap/windows.md
                  - Merge: book/20-olap/merge.md
                  - Incremental loads: book/20-olap/incremental-loads.md
          - "Part III: Knowledge and AI":
              - 21. A vault of documents: book/21-a-vault.md
              - 22. Links and graphs: book/22-graphs.md
              - 23. Finding cards by meaning: book/23-retrieval.md
              - 24. Queries inside documents: book/24-documents.md
              - 25. Agents and runs: book/25-agents-and-runs.md
              - 26. Agents inside documents: book/26-agents-inside-documents.md
              - 27. The hyper web: book/27-the-hyper-web.md
          - "Part IV: The standard library":
              - 28. Statistics: book/28-statistics.md
              - 29. Random values: book/29-random.md
              - 30. Digests and encodings: book/30-digests-and-encodings.md
              - 31. Keys and cryptography: book/31-cryptography.md
          - "Part V: Extending HQL":
              - 32. Functions and declarations:
                  - book/32-functions-and-declarations.md
                  - Declarations: book/32-functions-and-declarations/declarations.md
                  - How the standard library is built: book/32-functions-and-declarations/how-std-is-built.md
              - 33. Packages and extensions: book/33-packages-and-extensions.md
              - 34. Writing an extension:
                  - book/34-writing-an-extension.md
                  - The crate: book/34-writing-an-extension/the-crate.md
                  - The prelude: book/34-writing-an-extension/the-prelude.md
                  - The contract: book/34-writing-an-extension/contracts.md
                  - Natives: book/34-writing-an-extension/natives.md
                  - Values and errors: book/34-writing-an-extension/values-and-errors.md
                  - Functions and the context: book/34-writing-an-extension/lambdas-and-context.md
              - 35. How a library is loaded:
                  - book/35-how-a-library-is-loaded.md
                  - Static and dynamic libraries: book/35-how-a-library-is-loaded/static-and-dynamic.md
                  - The entry point: book/35-how-a-library-is-loaded/the-entry-point.md
                  - The version rule: book/35-how-a-library-is-loaded/the-version-rule.md
              - 36. Installing packages:
                  - book/36-installing-packages.md
                  - A local crate: book/36-installing-packages/a-local-crate.md
                  - A shared project: book/36-installing-packages/a-shared-project.md
              - 37. The registry and publishing: book/37-the-registry-and-publishing.md
              - 38. The ml package: book/38-the-ml-package.md
      - Demo: https://github.com/ewiger/hql-demo
      - Examples: examples.md
  # A section per package, a page per module; a function, type or trait is
  # reached from its module's page. `cargo test` fails when this
  # differs from the library.
  - Reference:
      - reference.md
      - std:
          - std/core: reference/std/core.md
          - std/doc: reference/std/doc.md
          - std/retrieval: reference/std/retrieval.md
          - std/graph: reference/std/graph.md
          - std/knowledge: reference/std/knowledge.md
          - std/collections: reference/std/collections.md
          - std/string: reference/std/string.md
          - std/seq: reference/std/seq.md
          - std/math: reference/std/math.md
          - std/stats: reference/std/stats.md
          - std/time: reference/std/time.md
          - std/random: reference/std/random.md
          - std/option: reference/std/option.md
          - std/result: reference/std/result.md
          - std/regex: reference/std/regex.md
          - std/format: reference/std/format.md
          - std/io: reference/std/io.md
          - std/io/fs: reference/std/io/fs.md
          - std/io/env: reference/std/io/env.md
          - std/io/net: reference/std/io/net.md
          - std/io/logging: reference/std/io/logging.md
          - std/io/db/sqlite: reference/std/io/db/sqlite.md
          - std/io/db/postgres: reference/std/io/db/postgres.md
          - std/io/db/spark: reference/std/io/db/spark.md
          - std/io/transaction: reference/std/io/transaction.md
          - std/io/msg/nats: reference/std/io/msg/nats.md
          - std/io/msg/nats_jetstream: reference/std/io/msg/nats_jetstream.md
          - std/crypto/digest: reference/std/crypto/digest.md
          - std/encoding: reference/std/encoding.md
          - std/bytes: reference/std/bytes.md
          - std/crypto: reference/std/crypto.md
          - std/validators: reference/std/validators.md
      - hmd:
          - hmd: reference/hmd.md
          - hmd/vault: reference/hmd/vault.md
          - hmd/search: reference/hmd/search.md
          - hmd/search/lexical: reference/hmd/search/lexical.md
          - hmd/search/semantic: reference/hmd/search/semantic.md

# A primitive's reference page is reached from its module's page, not from the
# nav.
not_in_nav: |
  /reference/

# A `.hmd` source is not served: the plugin registers the page it becomes, and
# without this MkDocs would also copy the source into the site as a static file.
exclude_docs: |
  *.hmd

extra:
  generator: false
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ewiger/hql
      name: HQL on GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/hql
      name: HQL on crates.io

extra_css:
  - assets/hql.css

# A miss is reported rather than fatal; `doc/stack.hmd` asks public pages to
# link to the repository by URL, so a miss is a page to fix.
validation:
  links:
    not_found: info
    anchors: info

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
