site_name: HQL
site_description: Hyper Query Language — a statically typed language for querying, transforming, connecting and computing over data, knowledge and AI workflows.

# Served from GitHub Pages under a custom domain. The build does not need this —
# MkDocs emits relative links — but canonical URLs and `sitemap.xml` are wrong
# without it. The domain itself is a DNS record plus the repository's Pages
# setting; see the documentation-site section of `doc/stack.md`.
site_url: https://hql.hypermarkdown.org/

repo_url: https://github.com/ewiger/hql
repo_name: ewiger/hql
edit_uri: edit/main/doc/public/

# Everything in this repository is MIT, code and prose alike, so one string
# states the whole claim and no footer template has to carry two.
copyright: © 2026 Yauhen Yakimovich · <a href="https://github.com/ewiger/hql/blob/main/LICENSE">MIT</a>

# The site is for people using HQL, and only `doc/public/` is published. The
# design of the language — the wiki, the models, the proposals and the working
# memory — stays in the repository.
docs_dir: doc/public

# A card and its folder note share one URL, so directory URLs are required.
use_directory_urls: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  # The sibling site's chrome — near-black with an amber accent — so the two
  # read as one family. HQL's own mark sets it apart rather than a new palette.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# `Learn` is the prose read cold, in reading order. `Reference` is what is
# consulted afterwards.
nav:
  - Home: index.md
  - Learn:
      - Install: install.md
      - The HQL book:
          - learn/index.md
          - 1. Hello world: learn/01-hello-world.md
          - 2. Data types:
              - learn/02-data-types/index.md
              - Int: learn/02-data-types/int.md
              - Float: learn/02-data-types/float.md
              - Decimal: learn/02-data-types/decimal.md
              - String: learn/02-data-types/string.md
              - Bool: learn/02-data-types/bool.md
              - Data: learn/02-data-types/data.md
              - Option: learn/02-data-types/option.md
              - Sets, Data and maps: learn/02-data-types/sets-data-and-maps.md
          - 3. Collections: learn/03-collections.md
          - 4. Functions: learn/04-functions.md
          - 5. Asking questions: learn/05-questions.md
          - 6. A vault of documents: learn/06-a-vault.md
          - 7. Links and graphs: learn/07-graphs.md
          - 8. Finding cards by meaning: learn/08-retrieval.md
          - 9. Streams that do not end: learn/09-streams.md
          - 10. Writing results out: learn/10-output.md
          - 11. Queries inside documents: learn/11-documents.md
          - 12. Working with hql: learn/12-working-with-hql.md
          - 13. Reading and writing data: learn/13-reading-and-writing.md
          - 14. Channels and logs: learn/14-channels-and-logs.md
          - 15. Agents and runs: learn/15-agents-and-runs.md
          - 16. Types, traits and modules:
              - learn/16-types-traits-and-modules/index.md
              - Traits: learn/16-types-traits-and-modules/traits.md
      - Examples: examples.md
  - Reference: reference.md

# The roadmap is reached from the book's closing pages, not from the nav.
not_in_nav: |
  roadmap.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ewiger/hql
      name: HQL on GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/hql
      name: HQL on crates.io

extra_css:
  - assets/hql.css

# A miss is reported rather than fatal; `doc/stack.md` asks public pages to
# link to the repository by URL, so a miss is a page to fix.
validation:
  links:
    not_found: info
    anchors: info

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
