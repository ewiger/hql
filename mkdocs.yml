site_name: HQL
site_description: Hyper Query Language — a statically typed language for querying, transforming, connecting and computing over data, knowledge and AI workflows.

# Served from GitHub Pages under a custom domain. The build does not need this —
# MkDocs emits relative links — but canonical URLs and `sitemap.xml` are wrong
# without it. The domain itself is a DNS record plus the repository's Pages
# setting; see the documentation-site section of `doc/stack.md`.
site_url: https://hql-lang.org/

repo_url: https://github.com/ewiger/hql
repo_name: ewiger/hql
edit_uri: edit/main/doc/public/

# Everything in this repository is MIT, code and prose alike, so one string
# states the whole claim and no footer template has to carry two.
copyright: © 2026 Yauhen Yakimovich · <a href="https://github.com/ewiger/hql/blob/main/LICENSE">MIT</a>

# The site is for people using HQL, and only `doc/public/` is published. The
# design of the language — the wiki, the models, the proposals and the working
# memory — stays in the repository.
docs_dir: doc/public

# A card and its folder note share one URL, so directory URLs are required.
use_directory_urls: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  # The sibling site's chrome — near-black with an amber accent — so the two
  # read as one family. HQL's own mark sets it apart rather than a new palette.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # Each release is published under its version, `/vX.Y.Z/`, and `latest`
  # is the newest; see the documentation-site section of `doc/stack.md`.
  - mike:
      alias_type: redirect
      canonical_version: latest

# `Learn` is the prose read cold, in reading order. `Reference` is what is
# consulted afterwards.
nav:
  - Home: index.md
  - Learn:
      - Install: install.md
      - The HQL book:
          - learn/index.md
          - 1. Hello world: learn/01-hello-world.md
          - 2. Data types:
              - learn/02-data-types/index.md
              - Int: learn/02-data-types/int.md
              - Float: learn/02-data-types/float.md
              - Decimal: learn/02-data-types/decimal.md
              - String: learn/02-data-types/string.md
              - Bool: learn/02-data-types/bool.md
              - Data: learn/02-data-types/data.md
              - Option: learn/02-data-types/option.md
              - Sets, Data and maps: learn/02-data-types/sets-data-and-maps.md
          - 3. Collections: learn/03-collections.md
          - 4. Functions:
              - learn/04-functions/index.md
              - Declaring a function: learn/04-functions/declaring.md
              - Function bodies: learn/04-functions/bodies.md
              - Generic functions: learn/04-functions/generics.md
              - Aliases and holes: learn/04-functions/aliases-and-holes.md
          - 5. Modules:
              - learn/05-modules/index.md
              - Receiver modules: learn/05-modules/receiver-modules.md
              - Visibility: learn/05-modules/visibility.md
              - How names resolve: learn/05-modules/names.md
          - 6. SQL-like Queries: learn/06-sql-like-queries.md
          - 7. A vault of documents: learn/07-a-vault.md
          - 8. Links and graphs: learn/08-graphs.md
          - 9. Finding cards by meaning: learn/09-retrieval.md
          - 10. Streams that do not end: learn/10-streams.md
          - 11. Writing results out: learn/11-output.md
          - 12. Queries inside documents: learn/12-documents.md
          - 13. Working with hql: learn/13-working-with-hql.md
          - 14. Reading and writing data: learn/14-reading-and-writing.md
          - 15. Channels and logs: learn/15-channels-and-logs.md
          - 16. Agents and runs: learn/16-agents-and-runs.md
          - 17. The type system:
              - learn/17-the-type-system/index.md
              - Records: learn/17-the-type-system/records.md
              - Unions and match: learn/17-the-type-system/unions-and-match.md
              - Results: learn/17-the-type-system/results.md
              - Subtypes and narrowing: learn/17-the-type-system/subtypes.md
              - Generics: learn/17-the-type-system/generics.md
              - Receiver calls: learn/17-the-type-system/receiver-calls.md
              - Operators: learn/17-the-type-system/operators.md
              - Traits: learn/17-the-type-system/traits.md
          - 18. Advanced data typing:
              - learn/18-advanced-data-typing/index.md
              - Open and closed types: learn/18-advanced-data-typing/open-and-closed.md
              - Type contracts: learn/18-advanced-data-typing/type-contracts.md
              - Data contracts: learn/18-advanced-data-typing/data-contracts.md
              - Validators: learn/18-advanced-data-typing/validators.md
              - Validation as a value: learn/18-advanced-data-typing/validation-as-a-value.md
              - Contracts and schemas: learn/18-advanced-data-typing/contracts-and-schemas.md
      - Examples: examples.md
  # A section per package, a page per module; a function, type or trait is
  # reached from its module's page. `cargo test` fails when this
  # differs from the library.
  - Reference:
      - reference/index.md
      - std:
          - std/core: reference/std/core/index.md
          - std/doc: reference/std/doc/index.md
          - std/retrieval: reference/std/retrieval/index.md
          - std/graph: reference/std/graph/index.md
          - std/knowledge: reference/std/knowledge/index.md
          - std/collections: reference/std/collections/index.md
          - std/string: reference/std/string/index.md
          - std/seq: reference/std/seq/index.md
          - std/math: reference/std/math/index.md
          - std/option: reference/std/option/index.md
          - std/result: reference/std/result/index.md
          - std/regex: reference/std/regex/index.md
          - std/format: reference/std/format/index.md
          - std/io: reference/std/io/index.md
          - std/io/net: reference/std/io/net/index.md
          - std/io/logging: reference/std/io/logging/index.md
          - std/vault: reference/std/vault/index.md
          - std/validators: reference/std/validators/index.md
      - search:
          - search/lexical: reference/search/lexical/index.md
          - search/semantic: reference/search/semantic/index.md

# A primitive's reference page is reached from its module's page, not from the
# nav.
not_in_nav: |
  /reference/

extra:
  generator: false
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ewiger/hql
      name: HQL on GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/hql
      name: HQL on crates.io

extra_css:
  - assets/hql.css

# A miss is reported rather than fatal; `doc/stack.md` asks public pages to
# link to the repository by URL, so a miss is a page to fix.
validation:
  links:
    not_found: info
    anchors: info

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
