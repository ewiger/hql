# The project the HQL tutorial runs in. See doc/public/learn/index.hmd. Its
# documents are a vault too, marked by `.hmd/` beside this directory.

# The book's own modules, `club.reading` and `club.titles`, are files under
# `lib/`.
[modules]
roots = ["lib"]

# Read by the `ai` extension only, which the book describes as design; the
# current binary ignores these tables (HQL-0022).
[ai]
recordings = ".hql/runs"

[ai.memory]
dir = "memory"

[ai.models.default]
api = "messages"
endpoint = "https://api.anthropic.com/v1/messages"
model = "claude-sonnet-5-5"
max_tokens = 1024
temperature = 0
