# Kanban board — the index of doc/issues/.
#
# board.items holds the columns (swimlanes); top to bottom is the flow. Each
# column is an ordered list of issue cards, highest priority first. Move a card
# between columns as work progresses, and bump last_id when adding an issue.
# When an issue is Done and no longer relevant, archive its file to
# .grem/issues/archive/ and delete its card here.
#
# Convention: doc/wiki/kanban.hmd

board:
  title: "doc/issues/ Kanban board"
  description: "The index of doc/issues/."
  columns: [
    { name: "backlog", description: "Issues that are not yet prioritized." },
    { name: "todo", description: "Issues that are prioritized and ready to work on." },
    { name: "doing", description: "Issues that are currently being worked on." },
    { name: "done", description: "Issues that have been completed." }
  ]
  last_id: 11 # to be incremented when adding a new issue card
  items:
    backlog:
      - id: "0010"
        title: "`yield` and `bind`: generated sequences as query sources"
        file: 0010-yield-and-bind.md
      - id: "0009"
        title: A function type, and functions as values
        file: 0009-function-type-and-constructor.md
      - id: "0008"
        title: "`cards` is a vault binding, not a keyword"
        file: 0008-cards-as-a-vault-binding.md
    todo:
      - id: "0004"
        title: Unify the collection-order vocabulary
        file: 0004-collection-order-vocabulary.md
    doing: []
    done:
      - id: "0011"
        title: Refactor checked execution, vault assembly, YAML, and extension contracts
        file: 0011-runtime-architecture-refactoring.md
      - id: "0007"
        title: Evaluate a collection literal at its checked element type
        file: 0007-checked-element-type-at-runtime.md
      - id: "0006"
        title: "`Scalar`, and `Data` as a union"
        file: 0006-scalar-and-data-union.md
      - id: "0005"
        title: Replace `<:` with `:`
        file: 0005-colon-subtype-operator.md
      - id: "0003"
        title: Parse and check `type` declarations
        file: 0003-type-declarations.md
      - id: "0002"
        title: Semantic retrieval over a real embedding index
        file: 0002-semantic-retrieval.md
      - id: "0001"
        title: The extension mechanism
        file: 0001-extension-mechanism.md
