# Kanban board — the index of doc/issues/.
#
# board.items holds the columns (swimlanes); top to bottom is the flow. Each
# column is an ordered list of issue cards, highest priority first. Move a card
# between columns as work progresses, and bump last_id when adding an issue.
# When an issue is done, move its file to doc/issues/archive/ and delete its
# card here; doc/status/kanban-status.hmd counts and lists the archive.
#
# Convention: doc/issues/README.hmd

board:
  title: "doc/issues/ Kanban board"
  description: "The index of doc/issues/."
  columns: [
    { name: "backlog", description: "Issues that are not yet prioritized." },
    { name: "todo", description: "Issues that are prioritized and ready to work on." },
    { name: "doing", description: "Issues that are currently being worked on." },
    { name: "done", description: "Issues that have been completed." }
  ]
  last_id: 76 #to be incremented when adding a new issue card
