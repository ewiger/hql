        file: 0055-defaults-on-functions-with-a-body.md
      - id: "0049"
        title: "One extension per package: fold the descriptors into `std` and `search`"
        file: 0049-one-extension-per-package.md
      - id: "0047"
        title: "Cardinality is `size`: a String's `size` replaces `length`"
        file: 0047-cardinality-is-size.md
      - id: "0029"
        title: "Binary formats, and codecs an extension or a package provides"
        file: 0029-binary-formats-and-codecs.md
      - id: "0027"
        title: A partial record type reads card metadata as typed fields
