[package]
name = "hql-sys"
version = "0.8.0"
description = "The operating-system calls of hql that need unsafe, behind a safe API"
license = "MIT"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ewiger/hql"
homepage = "https://github.com/ewiger/hql"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
